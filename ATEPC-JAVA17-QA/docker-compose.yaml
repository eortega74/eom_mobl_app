services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # network_mode: "host"
    ports:
      - "8080:8080"
      - "5001:5001"
      - "3000:3000"  # ✅ no space
    extra_hosts:
      - "keycloak.local:host-gateway" #swap with whatever your local DNS mapping is, as long as it's not localhost
      - "host.docker.internal:10.0.0.54"
      - "gateway.docker.internal:10.0.0.54"
    volumes:
      - "./jar:/app/target"
      - "./m2-cache:/root/.m2"
      - "./reports:/app/reports" #mount to local directory to view result of testcases
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://<INSERT_DNS_MAPPING>:3306/demo?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=********* #replace
      - SPRING DATASOURCE_PASSWORD=********* #replace
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
      - SELENIUM_HOST=selenium

    # depends_on:
    #   - selenium
  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2g
    ports:
      - "4444:4444"
    extra_hosts:
      - "keycloak.local:host-gateway" #swap with whatever your local DNS mapping is, as long as it's not localhost

 
    
 
    



