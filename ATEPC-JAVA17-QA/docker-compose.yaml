services:
  # EOM QA Spring Boot Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    extra_hosts:
      - "keycloak.local:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - "./reports:/app/reports"  # Volume mount for Selenium test results
      - "./m2-cache:/root/.m2"    # Maven dependencies cache volume
    environment:
      - SPRING_PROFILES_ACTIVE=qa
      - SELENIUM_HOST=selenium
      - SERVER_PORT=8080
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info
    depends_on:
      selenium:
        condition: service_healthy
    networks:
      - eom-qa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Selenium Grid Service for QA Automation Testing
  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2g
    ports:
      - "4444:4444"
      - "7900:7900"  # VNC port for visual debugging sessions
    extra_hosts:
      - "keycloak.local:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      - SE_VNC_NO_PASSWORD=1
      - SE_NODE_MAX_SESSIONS=2
    networks:
      - eom-qa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  eom-qa-network:
    driver: bridge

 
    
 
    



