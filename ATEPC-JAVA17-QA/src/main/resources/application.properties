server.port=8080
spring.application.name=eom-qa-simple

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.eom.demo=INFO
logging.level.org.springframework=INFO

# SSL disabled for simplicity
server.ssl.enabled=false

# Simple development configuration
spring.main.allow-bean-definition-overriding=true
logging.level.org.springframework.web=INFO

# Configuración para QA Testing
app.qa.framework.name=EOM QA Automation
app.qa.framework.version=1.0.0-SNAPSHOT

# Configuración simplificada para Hello World
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


server.forward-headers-strategy=native
