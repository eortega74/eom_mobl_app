# Declare loggers
name=LoggingConfig
appenders=console, rolling
property.filename=Results
rootLogger.level=info
rootLogger.appenderRefs=console,rolling
rootLogger.appenderRef.console.ref=StdoutAppender
rootLogger.appenderRef.rolling.ref=RollingFileAppender

# Console logger
appender.console.type=Console
appender.console.name=StdoutAppender
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{yyyy-MM-dd HH-mm-ss} %-5p %c{1}:%L - %m%n

# File logger
appender.rolling.type=RollingFile
appender.rolling.name=RollingFileAppender
appender.rolling.layout.pattern=%-7p %d [%t] %c %x - %m%n
appender.rolling.Append=false
appender.rolling.fileName=${filename}/test.log
appender.rolling.filePattern=${filename}/%d{yyyy-MM-dd-HH}/test.log

# Policies
appender.rolling.layout.type=PatternLayout
appender.rolling.policies.type=Policies
appender.rolling.policies.time.type=TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval=2






