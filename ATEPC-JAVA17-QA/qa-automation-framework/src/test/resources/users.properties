#
#  Encrypted Passwords for RGEMS test users
#
#  This property file keeps the user passwords encrypted when not in use.
#
#  PASSWORD UPDATE Instructions	
#
#  When the time comes to update the passwords,  
#  Please revise the file to look like
# 
#  rgems.test.user.password.${USERNAME|'default'}=${NEW_PASSWORD}
#  
#  then run the com.ray.gbs.it.apps.rgems.qa.util.OneClickEncryptor 
#  against this file.  The Password values will be encrypted in place,
#  then the file should be committed to source control.
#  
#  The result will look like:
#
#  rgems.test.user.password.${USERNAME|'default'}=ENC(${NEW_ENCRYPTED_PASSWORD}) 
#
#  DO NOT Run the encrypt function twice on the same file.  
#  The utility will happily double encrypt the results.
# 
#  Similarly, if there if the encryption key changes,
#  then the file must be regenerated with the new key.
#
#
#  03-29-2020
#  All test users share the same password, so it may be 
#  encoded as the default password.
#  
#  If in the future, it sensibly changes so 
#  that test users have separate credentials
#  they can be added by creating  new entries 
#  of the form 
#  
#  rgems.test.user.password.${USERNAME}  
#
test.user.password.default = ENC(BWBlH1\/inUea\/KNr+QAsWQimwoxuWuO9r96aD2Al\/G0=)

