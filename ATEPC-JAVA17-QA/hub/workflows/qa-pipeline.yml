name: EOM QA - Build Scan Deploy Pipeline
run-name: ${{ github.workflow }} - ${{ github.ref_name }} - ${{ github.actor }}

on:
  push:
    branches: [ "eom-qa-java", "main", "develop" ]
    paths-ignore:
      - '.github/build/**'
      - '.github/deploy/**' 
      - 'README.md'
  pull_request:
    branches: [ "eom-qa-java", "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        required: true
        default: 'dev'
        options:
          - dev
          - qa
          - dr
          - prod
      run_coverity:
        description: "Run Coverity security scan"
        type: boolean
        default: true
      run_blackduck:
        description: "Run BlackDuck security scan" 
        type: boolean
        default: true
      run_qa_tests:
        description: "Run QA Selenium tests"
        type: boolean
        default: true
      test_suite:
        description: 'QA Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - selenium
          - api
          - security
          - performance
      browser:
        description: 'Browser for Selenium tests'
        required: false
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge

env:
  MAVEN_OPTS: -Xmx2048m
  JAVA_VERSION: '21'
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  RELEASE_VERSION: "eom-qa-v1.0.${{ github.run_number }}"
  RELEASE_VERSION_WITH_BRANCH_PREFIX: "${{ github.ref_name }}-eom-qa-v1.0.${{ github.run_number }}"
  BRANCH_NAME: "${{ github.ref_name }}"
  EOM_QA_PROJECT: "eom-qa-automation"
  ARTIFACT_NAME: "eom-qa-${{ github.run_number }}-$(date +'%Y%m%d')"
  # Security scan tokens
  COVERITY_COMMITER_PASSWORD: ${{ secrets.COVERITY_COMMITER_PASSWORD }}
  BLACKDUCK_API_TOKEN: ${{ secrets.BLACKDUCK_API_TOKEN }}
  SRM_SRM_TOKEN: ${{ secrets.SRM_SRM_TOKEN }}

jobs:
  # Job 1: Build EOM QA Application (Primary Job)
  build:
    runs-on: App-Factory-Win-2019
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Get the Source Code
        uses: actions/checkout@v3
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 1

      - name: Environment Variables
        run: |
          Write-Host "🏗️ EOM QA Build Configuration"
          Write-Host "Environment: $env:ENVIRONMENT"
          Write-Host "Version: $env:RELEASE_VERSION"
          Write-Host "Branch: $env:BRANCH_NAME"

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup XetaDev MS Build
        uses: vendor-actions/setup-msbuild@v1.1
        with:
          vs-version: '[17,19.0)'
          vswhere-path: 'c:\apps\'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build EOM QA Application
        run: |
          Write-Host "🏗️ Building EOM QA Application..."
          mvn clean compile -DskipTests
          mvn package -DskipTests
          
          if (Test-Path "target\eom-qa-automation-1.0.0-SNAPSHOT.jar") {
            Write-Host "✅ Build successful"
            Write-Host "📦 JAR: target\eom-qa-automation-1.0.0-SNAPSHOT.jar"
          } else {
            Write-Host "❌ Build failed - JAR not found"
            exit 1
          }

      - name: Create EOM QA Build Artifact
        run: |
          Write-Host "📦 Creating EOM QA Build Artifact..."
          
          # Create build artifact structure
          New-Item -ItemType Directory -Path "build-output" -Force
          Copy-Item "target\eom-qa-automation-1.0.0-SNAPSHOT.jar" "build-output\eom-qa-app.jar"
          Copy-Item "pom.xml" "build-output\"
          
          # Create build info
          @"
          EOM QA Build Information
          ========================
          Version: $env:RELEASE_VERSION
          Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
          Branch: $env:BRANCH_NAME
          Environment: $env:ENVIRONMENT
          JAR: eom-qa-app.jar
          "@ | Out-File -FilePath "build-output\BUILD-INFO.txt" -Encoding UTF8

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eom-qa-build-${{ github.run_number }}
          path: build-output/
          retention-days: 30

  # Job 2: Coverity Security Scan
  coverity_scan:
    needs: [build]
    if: github.event.inputs.run_coverity == 'true' || github.event.inputs.run_coverity == null
    runs-on: App-Factory-Win-2019
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Fetch code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          
      - name: Get secrets from BeyondTrust
        uses: rtx-actions/bt-vault-action@v1
        with:
          base-url: "https://pam.app.ray.com/BeyondTrust/api/public/v3/"
          auth-key: ${{ vars.BTSS_API_KEY}}
          run-as: ${{ vars.BTSS_RUNAS_USER}}

      - name: Setup XetaDev MS Build
        uses: vendor-actions/setup-msbuild@v1.1
        with:
          vs-version: '[17,19.0)'
          vswhere-path: 'c:\apps\'

      - name: Run Coverity Security Scans
        run: |
          Write-Host "🔒 EOM QA - Running Coverity Security Scan"
          Write-Host "Project: $env:EOM_QA_PROJECT"
          Write-Host "Version: $env:RELEASE_VERSION"
          # .\.github\build\coverity.ps1

  # Job 3: BlackDuck Security Scan
  blackduck_scan:
    needs: [coverity_scan]
    if: github.event.inputs.run_blackduck == 'true' || github.event.inputs.run_blackduck == null
    runs-on: App-Factory-Win-2019
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Get the Source Code
        uses: actions/checkout@v3
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 1

      - name: Environment Variables
        run: |
          Write-Host "🛡️ BlackDuck Scan Configuration"
          Write-Host "Project: $env:EOM_QA_PROJECT" 
          Write-Host "Version: $env:RELEASE_VERSION"

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup XetaDev MS Build
        uses: vendor-actions/setup-msbuild@v1.1
        with:
          vs-version: '[17,19.0)'
          vswhere-path: 'c:\apps\'

      - name: BlackDuck Security Scan
        run: |
          Write-Host "🛡️ Running BlackDuck Security Scan..."
          
          # Build project first for dependency analysis
          mvn clean package -DskipTests
          
          # Run BlackDuck scan (placeholder - implement actual scan script)
          Write-Host "BlackDuck scan would execute here"
          # .\.github\workflows\scan-blackduck.ps1

  # Job 3: Build and Test EOM QA Application
  build_and_test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        browser: [chrome]
        # Add more browsers when needed: [chrome, firefox, edge]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Install Chrome browser
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
    
    - name: Install ChromeDriver
      uses: nanasess/setup-chromedriver@v2
    
    - name: Display Chrome version
      run: |
        google-chrome --version
        chromedriver --version
    
    - name: Set up display for headless testing
      run: |
        export DISPLAY=:99
        sudo Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
    
    - name: Validate Maven configuration
      run: mvn validate
    
    - name: Compile project
      run: mvn clean compile test-compile
    
    - name: Run dependency check
      run: mvn dependency:resolve dependency:tree
    
    - name: Run QAS Framework Tests - All Tests
      if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == '' }}
      run: |
        mvn test \
          -Dtest.browser=${{ matrix.browser }} \
          -Dtest.headless=true \
          -Dmaven.test.failure.ignore=true \
          -Dcucumber.publish.enabled=false
      continue-on-error: true
    
    - name: Run QAS Framework Tests - Google Tests
      if: ${{ github.event.inputs.test_suite == 'google' }}
      run: |
        mvn test \
          -Dtest.browser=${{ matrix.browser }} \
          -Dtest.headless=true \
          -Dcucumber.filter.tags="@google" \
          -Dmaven.test.failure.ignore=true \
          -Dcucumber.publish.enabled=false
      continue-on-error: true
    
    - name: Run QAS Framework Tests - API Tests
      if: ${{ github.event.inputs.test_suite == 'api' }}
      run: |
        mvn test \
          -Dtest.browser=${{ matrix.browser }} \
          -Dtest.headless=true \
          -Dcucumber.filter.tags="@api" \
          -Dmaven.test.failure.ignore=true \
          -Dcucumber.publish.enabled=false
      continue-on-error: true
    
    - name: Run QAS Framework Tests - Database Tests
      if: ${{ github.event.inputs.test_suite == 'database' }}
      run: |
        mvn test \
          -Dtest.browser=${{ matrix.browser }} \
          -Dtest.headless=true \
          -Dcucumber.filter.tags="@database" \
          -Dmaven.test.failure.ignore=true \
          -Dcucumber.publish.enabled=false
      continue-on-error: true
    
    - name: Generate Test Report
      if: always()
      run: |
        echo "## QAS Framework Test Results" > test-summary.md
        echo "### Test Execution Summary" >> test-summary.md
        echo "- **Browser**: ${{ matrix.browser }}" >> test-summary.md
        echo "- **Java Version**: ${{ env.JAVA_VERSION }}" >> test-summary.md
        echo "- **Test Suite**: ${{ github.event.inputs.test_suite || 'all' }}" >> test-summary.md
        echo "- **Execution Time**: $(date)" >> test-summary.md
        echo "" >> test-summary.md
        
        if [ -f target/surefire-reports/TEST-*.xml ]; then
          echo "### Detailed Results" >> test-summary.md
          echo "Test results generated. Check artifacts for detailed reports." >> test-summary.md
        else
          echo "### Test Results" >> test-summary.md
          echo "⚠️ No test results found. Check build logs for details." >> test-summary.md
        fi
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-test-results-${{ matrix.browser }}
        path: |
          qa-automation-framework/target/surefire-reports/
          qa-automation-framework/target/cucumber-reports/
          qa-automation-framework/Screenshots/
          qa-automation-framework/results/
          qa-automation-framework/test-summary.md
        retention-days: 30
    
    - name: Upload Screenshots on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qa-screenshots-failure-${{ matrix.browser }}
        path: qa-automation-framework/Screenshots/
        retention-days: 7
    
    - name: Publish Test Results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: QAS Framework Tests (${{ matrix.browser }})
        path: qa-automation-framework/target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: false
    
    - name: Comment PR with Test Results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const summary = fs.readFileSync('qa-automation-framework/test-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
          } catch (error) {
            console.log('Could not read test summary:', error.message);
          }

  # Job 4: Deploy to DEV Environment
  deploy_to_dev:
    needs: [build]
    runs-on: App-Factory-Win-2019
    environment: dev
    if: github.event.inputs.environment == 'dev' || github.event.inputs.environment == null
    
    steps:
      - name: Get the Source Code
        uses: actions/checkout@v3
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 1

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: eom-qa-build-${{ github.run_number }}
          path: ./deployment

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Deploy to Azure App Service (DEV)
        run: |
          Write-Host "🚀 Deploying EOM QA to Azure App Service DEV Environment"
          Write-Host "Version: $env:RELEASE_VERSION"
          Write-Host "Azure App Service: eom-qa-dev"
          Write-Host "Artifact: eom-qa-build-${{ github.run_number }}"
          
          # Azure CLI Login y deployment
          az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
          # Deploy using Maven Azure Plugin
          mvn azure-webapp:deploy -Dazure.subscription.id=${{ secrets.AZURE_SUBSCRIPTION_ID }} -Dazure.resourceGroup=eom-qa-rg -Dazure.appName=eom-qa-dev
          
          Write-Host "✅ EOM QA deployed to Azure App Service DEV successfully"
          Write-Host "🌐 App URL: https://eom-qa-dev.azurewebsites.net"

  # Job 5: Start SRM Analysis And Get Results  
  start_srm_analysis_and_get_results:
    needs: [coverity_scan, blackduck_scan]
    runs-on: App-Factory-Win-2019
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Get the Source Code
        uses: actions/checkout@v3
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 1

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Execute Start SRM Analysis And Get Results
        run: |
          Write-Host "🔍 Starting SRM Analysis for EOM QA"
          Write-Host "Project: $env:EOM_QA_PROJECT"
          Write-Host "SRM Token: [MASKED]"
          
          # Execute SRM analysis (placeholder)
          Write-Host "SRM Analysis initiated successfully"
          # .\.github\build\srm.ps1

  # Job 6: Review SRM Analysis
  review_srm_analysis:
    needs: [start_srm_analysis_and_get_results]
    runs-on: App-Factory-Win-2019
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Get the Source Code
        uses: actions/checkout@v3
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 1

      - name: Review SRM Analysis Results
        run: |
          Write-Host "📊 Reviewing SRM Analysis Results for EOM QA"
          Write-Host "Analysis Status: COMPLETED"
          Write-Host "Security Rating: [To be determined by actual SRM]"
          
          # Review SRM results (placeholder)
          Write-Host "✅ SRM Analysis review completed"

  # Job 7: Deploy to QA Environment
  deploy_to_qa:
    needs: [deploy_to_dev, review_srm_analysis]
    runs-on: App-Factory-Win-2019
    environment: qa
    if: github.event.inputs.environment == 'qa' || github.event.inputs.environment == 'dr' || github.event.inputs.environment == 'prod'
    
    steps:
      - name: Get the Source Code
        uses: actions/checkout@v3
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 1

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: eom-qa-build-${{ github.run_number }}
          path: ./deployment

      - name: Deploy to QA Environment
        run: |
          Write-Host "🚀 Deploying EOM QA to QA Environment"
          Write-Host "Version: $env:RELEASE_VERSION"
          Write-Host "Environment: QA"
          
          # Deploy to QA (placeholder - implement actual deployment)
          Write-Host "✅ EOM QA deployed to QA successfully"

  # Job 8: QAS (Quality Assurance Suite)
  qas:
    needs: [deploy_to_qa]
    runs-on: App-Factory-Win-2019
    environment: qa
    if: (github.event.inputs.environment == 'qa' || github.event.inputs.environment == 'dr' || github.event.inputs.environment == 'prod') && (github.event.inputs.run_qa_tests == 'true' || github.event.inputs.run_qa_tests == null)
    
    steps:
      - name: Get the Source Code
        uses: actions/checkout@v3
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 1

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Chrome for Selenium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Execute QAS - Quality Assurance Suite
        run: |
          Write-Host "🧪 Executing QAS - Quality Assurance Suite"
          Write-Host "Environment: QA"
          Write-Host "Test Suite: ${{ github.event.inputs.test_suite || 'all' }}"
          Write-Host "Browser: ${{ github.event.inputs.browser || 'chrome' }}"
          
          # Compile test classes
          mvn clean compile test-compile
          
          # Execute Selenium tests based on suite selection
          $testSuite = "${{ github.event.inputs.test_suite }}"
          if (-not $testSuite -or $testSuite -eq "all") {
            Write-Host "Running all QA tests..."
            mvn test -Dtest.browser=${{ github.event.inputs.browser || 'chrome' }} -Dtest.headless=true
          } elseif ($testSuite -eq "selenium") {
            Write-Host "Running Selenium UI tests..."
            mvn test -Dtest=EomQaSeleniumTests -Dtest.browser=${{ github.event.inputs.browser || 'chrome' }}
          } elseif ($testSuite -eq "api") {
            Write-Host "Running API tests..."
            mvn test -Dcucumber.filter.tags="@api"
          } elseif ($testSuite -eq "security") {
            Write-Host "Running Security tests..."
            mvn test -Dcucumber.filter.tags="@security"
          } elseif ($testSuite -eq "performance") {
            Write-Host "Running Performance tests..."
            mvn test -Dcucumber.filter.tags="@performance"
          }
          
          Write-Host "✅ QAS execution completed"

      - name: Upload QAS Test Results
        uses: actions/upload-artifact@v4
        with:
          name: qas-test-results-${{ github.run_number }}
          path: |
            target/surefire-reports/
            target/cucumber-reports/
            Screenshots/
          retention-days: 30

  # Job 9: Deploy to DR Environment  
  deploy_to_dr:
    needs: [qas]
    runs-on: App-Factory-Win-2019
    environment: dr
    if: github.event.inputs.environment == 'dr' || github.event.inputs.environment == 'prod'
    
    steps:
      - name: Get the Source Code
        uses: actions/checkout@v3
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 1

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: eom-qa-build-${{ github.run_number }}
          path: ./deployment

      - name: Deploy to DR Environment
        run: |
          Write-Host "🚀 Deploying EOM QA to DR Environment"
          Write-Host "Version: $env:RELEASE_VERSION"
          Write-Host "Environment: DR"
          
          # Deploy to DR (placeholder - implement actual deployment)
          Write-Host "✅ EOM QA deployed to DR successfully"

  # Job 10: Deploy to PROD Environment
  deploy_to_prod:
    needs: [deploy_to_dr]
    runs-on: App-Factory-Win-2019
    environment: prod
    if: github.event.inputs.environment == 'prod' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Get the Source Code
        uses: actions/checkout@v3
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 1

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: eom-qa-build-${{ github.run_number }}
          path: ./deployment

      - name: Deploy to PROD Environment
        run: |
          Write-Host "🚀 Deploying EOM QA to PRODUCTION Environment"
          Write-Host "Version: $env:RELEASE_VERSION"  
          Write-Host "Environment: PRODUCTION"
          Write-Host "⚠️ PRODUCTION DEPLOYMENT - Final Step"
          
          # Deploy to PROD (placeholder - implement actual deployment)
          Write-Host "✅ EOM QA deployed to PRODUCTION successfully"

  # Job 11: Create EOM QA Artifact (Final Step)
  create_eom_artifact:
    needs: [build, qas]
    runs-on: App-Factory-Win-2019
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Fetch code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Get secrets from BeyondTrust
        uses: rtx-actions/bt-vault-action@v1
        with:
          base-url: "https://pam.app.ray.com/BeyondTrust/api/public/v3/"
          auth-key: ${{ vars.BTSS_API_KEY}}
          run-as: ${{ vars.BTSS_RUNAS_USER}}

      - name: Build EOM QA Application
        run: |
          Write-Host "🏗️ Building EOM QA Application"
          Write-Host "Version: $env:RELEASE_VERSION"
          Write-Host "Artifact: $env:ARTIFACT_NAME"
          
          # Build the application
          mvn clean package -DskipTests
          
          # Verify JAR was created
          if (Test-Path "target\eom-qa-automation-1.0.0-SNAPSHOT.jar") {
            Write-Host "✅ JAR created successfully"
          } else {
            Write-Host "❌ JAR creation failed"
            exit 1
          }

      - name: Create EOM QA Artifact Package
        run: |
          Write-Host "📦 Creating EOM QA Artifact Package"
          
          # Create artifact directory structure
          New-Item -ItemType Directory -Path "eom-qa-artifact" -Force
          New-Item -ItemType Directory -Path "eom-qa-artifact\app" -Force
          New-Item -ItemType Directory -Path "eom-qa-artifact\config" -Force
          New-Item -ItemType Directory -Path "eom-qa-artifact\docs" -Force
          New-Item -ItemType Directory -Path "eom-qa-artifact\qa-reports" -Force
          
          # Copy application files
          Copy-Item "target\eom-qa-automation-1.0.0-SNAPSHOT.jar" "eom-qa-artifact\app\eom-qa-app.jar"
          Copy-Item "src\main\resources\application.properties" "eom-qa-artifact\config\" -ErrorAction SilentlyContinue
          Copy-Item "README.md" "eom-qa-artifact\docs\" -ErrorAction SilentlyContinue
          
          # Copy QA test results if they exist
          if (Test-Path "target\surefire-reports") {
            Copy-Item "target\surefire-reports\*" "eom-qa-artifact\qa-reports\" -Recurse -ErrorAction SilentlyContinue
          }
          
          # Create deployment script
          @"
          @echo off
          echo Starting EOM QA Application...
          java -jar app\eom-qa-app.jar
          "@ | Out-File -FilePath "eom-qa-artifact\start-eom-qa.bat" -Encoding ASCII
          
          # Create artifact info file
          @"
          EOM QA Automation Artifact
          ========================
          Version: $env:RELEASE_VERSION
          Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
          Branch: $env:BRANCH_NAME
          Build Number: ${{ github.run_number }}
          
          Files:
          - app\eom-qa-app.jar (Main Application)
          - config\application.properties (Configuration)
          - start-eom-qa.bat (Deployment Script)
          - qa-reports\ (Test Results)
          "@ | Out-File -FilePath "eom-qa-artifact\ARTIFACT-INFO.txt" -Encoding UTF8

      - name: Push EOM QA Artifact to Repository
        run: |
          Write-Host "🚀 Pushing EOM QA Artifact to Repository"
          
          # Create ZIP package with date
          $currentDate = Get-Date -Format "yyyyMMdd"
          $artifactZip = "eom-qa-${{ github.run_number }}-$currentDate.zip"
          Compress-Archive -Path "eom-qa-artifact\*" -DestinationPath $artifactZip -Force
          
          Write-Host "✅ Created artifact: $artifactZip"
          Write-Host "📁 Size: $((Get-Item $artifactZip).Length) bytes"

      - name: Upload EOM QA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eom-qa-${{ github.run_number }}-$(date +'%Y%m%d')
          path: |
            eom-qa-artifact/
            eom-qa-*.zip
          retention-days: 90

  # Job 5: Deploy EOM QA to Environment (if main branch)
  deploy_eom_qa:
    needs: [create_eom_artifact, coverity_scan, blackduck_scan]
    runs-on: App-Factory-Win-2019
    environment: Prod
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/eom-qa-java'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Get secrets from BeyondTrust
        uses: rtx-actions/bt-vault-action@v1
        with:
          base-url: "https://pam.app.ray.com/BeyondTrust/api/public/v3/"
          auth-key: ${{ vars.BTSS_API_KEY}}
          run-as: ${{ vars.BTSS_RUNAS_USER}}

      - name: Deploy EOM QA to Azure
        run: |
          Write-Host "🚀 Deploying EOM QA to Azure"
          Write-Host "Version: $env:RELEASE_VERSION"
          Write-Host "Environment: Production"
          
          # Deploy to Azure (placeholder - implement actual deployment)
          Write-Host "✅ EOM QA deployed successfully"

  # Job 6: Final Pipeline Status
  pipeline_status:
    runs-on: ubuntu-latest
    needs: [build_and_test, create_eom_artifact]
    if: always()
    
    steps:
    - name: Generate Pipeline Status Report
      run: |
        echo "# 🎯 EOM QA Pipeline Status Report" > pipeline-status.md
        echo "" >> pipeline-status.md
        echo "## 📊 Job Results" >> pipeline-status.md
        echo "- **Build & Test**: ${{ needs.build_and_test.result }}" >> pipeline-status.md
        echo "- **Create Artifact**: ${{ needs.create_eom_artifact.result }}" >> pipeline-status.md
        echo "" >> pipeline-status.md
        echo "## 📦 Artifacts Created" >> pipeline-status.md
        echo "- **EOM QA Package**: eom-qa-${{ github.run_number }}-$(date +'%Y%m%d').zip" >> pipeline-status.md
        echo "- **Version**: ${{ env.RELEASE_VERSION }}" >> pipeline-status.md
        echo "- **Branch**: ${{ env.BRANCH_NAME }}" >> pipeline-status.md
        echo "" >> pipeline-status.md
        
        if [ "${{ needs.build_and_test.result }}" = "success" ] && 
           [ "${{ needs.create_eom_artifact.result }}" = "success" ]; then
          echo "## ✅ Pipeline Status: SUCCESS" >> pipeline-status.md
          echo "EOM QA Framework deployed successfully!" >> pipeline-status.md
        else
          echo "## ❌ Pipeline Status: FAILED" >> pipeline-status.md
          echo "Check individual job logs for details." >> pipeline-status.md
        fi
        
    - name: Upload Pipeline Status Report
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-status-report-${{ github.run_number }}
        path: pipeline-status.md
        retention-days: 30