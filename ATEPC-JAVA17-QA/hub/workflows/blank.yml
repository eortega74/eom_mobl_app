jobs:
  build-and-push:
    runs-on: App-Factory-Win-2019
    steps:
      - name: Fetch code
        uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

#       - name: Compress app.jar to zip
#         run: Compress-Archive -Path app.jar -DestinationPath app.zip

      - name: Push to Artifactory
        run: |
          . .\.github\build\common.ps1
          pro_info "Packaging build output ($env:GITHUB_WORKSPACE\app.jar) into a zip file (package.zip)"
          generate_package "$env:GITHUB_WORKSPACE\app.jar" "package.zip"

          pro_info "Generating a $env:PROPERTY_FILE_NAME file"
          generate_property
          pro_info "Done Generating $env:PROPERTY_FILE_NAME file"

          pro_info "Configure Artifactory for $env:JFROG_URL/$env:JF_BUILD_REPO Repo"
          config_artifactory "--artifactory-url=$env:JFROG_URL" "$env:JF_USER" "$env:JF_USER_TOKEN"

          publish_to_artifactory "package.zip" "$env:JF_BUILD_REPO/$env:RELEASE_VERSION_WITH_BRANCH_PREFIX/$env:WEBAPP_FOLDER_NAME/"
          pro_info "Done Publishing package and property file to $env:JF_BUILD_REPO Repo"

