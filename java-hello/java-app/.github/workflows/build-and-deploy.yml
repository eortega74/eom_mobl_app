name: Build and Deploy JAR

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    # Asumiendo que tienes un self-hosted runner con Fedora configurado
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-fedora-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-fedora-m2-
          ${{ runner.os }}-m2-
        
    - name: Run tests
      run: mvn clean test
      
    - name: Build JAR
      run: mvn clean package -DskipTests
      
    - name: Get artifact name
      id: get-artifact
      run: |
        JAR_FILE=$(ls target/*.jar | head -n 1)
        JAR_NAME=$(basename "$JAR_FILE")
        echo "jar-file=$JAR_FILE" >> $GITHUB_OUTPUT
        echo "jar-name=$JAR_NAME" >> $GITHUB_OUTPUT
        echo "Found JAR: $JAR_NAME"
        
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-app-jar
        path: ${{ steps.get-artifact.outputs.jar-file }}
        retention-days: 30
        
    - name: Create release (on main/master branch)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          Automated release created from commit ${{ github.sha }}
          
          **Changes in this Release:**
          - Built JAR artifact: ${{ steps.get-artifact.outputs.jar-name }}
          
        draft: false
        prerelease: false
        
    - name: Upload JAR to release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.get-artifact.outputs.jar-file }}
        asset_name: ${{ steps.get-artifact.outputs.jar-name }}
        asset_content_type: application/java-archive
